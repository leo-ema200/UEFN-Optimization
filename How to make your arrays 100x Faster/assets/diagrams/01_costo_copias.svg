<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510"><rect width="1440" height="510" rx="24" fill="#091525"/><rect x="23" y="22" width="1394" height="466" rx="22" fill="#13283f" stroke="#315268" stroke-width="2"/><text x="60" y="82" fill="#69e4ca" font-size="20" letter-spacing="3" font-family="Arial">MODELO DE COSTO</text><text x="60" y="136" fill="#fff" font-weight="bold" font-size="37" font-family="Arial">La concatenación repetitiva acumula copias</text><rect x="60" y="174" width="426.6666666666667" height="170" rx="14" fill="#1b344c" stroke="#54dac3" stroke-width="2"/><text x="80" y="239" fill="white" font-family="Arial" font-size="25" font-weight="bold">APPEND</text><text x="80" y="291" fill="#c1d6e7" font-family="Arial" font-size="20">Array += array{X}</text><rect x="506.6666666666667" y="174" width="426.6666666666667" height="170" rx="14" fill="#1b344c" stroke="#7baaff" stroke-width="2"/><text x="526.6666666666667" y="239" fill="white" font-family="Arial" font-size="25" font-weight="bold">COPIAR</text><text x="526.6666666666667" y="291" fill="#c1d6e7" font-family="Arial" font-size="20">1 + 2 + ... + n</text><rect x="953.3333333333334" y="174" width="426.6666666666667" height="170" rx="14" fill="#1b344c" stroke="#f8b46f" stroke-width="2"/><text x="973.3333333333334" y="239" fill="white" font-family="Arial" font-size="25" font-weight="bold">COMPRENSIÓN</text><text x="973.3333333333334" y="291" fill="#c1d6e7" font-family="Arial" font-size="20">for: ... do: X</text><text x="60" y="411" fill="#b6cad9" font-family="Arial" font-size="19">Modelo n(n + 1)/2 si cada iteración copia todos los anteriores; no es un conteo real de heap.</text><text x="60" y="459" fill="#819ab1" font-family="Arial" font-size="15">Ilustración editorial, no captura original ni medición local.</text></svg>